<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       const preco = Number(prompt("qual o valor do produto?"))
       const aVista =  preco - (preco * 0.10)
       const parcelado = preco / 3
       alert(`Preço: R$ ${preco.toFixed(2)}\nÀ vista R$: ${aVista.toFixed(2)}\nOu 3x de R$: ${parcelado.toFixed(2)}`)
    </script>
</body>
</html>
