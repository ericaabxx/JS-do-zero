<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const valorConta = Number(prompt("Digite o valor da conta"))
        const numeroPessoas = Number(prompt("Quantas pessoas iram pagar?"))
        const valorPorCliente = valorConta / numeroPessoas
        alert(`Valor da conta: R$${valorConta.toFixed(2)}\nNúmero de pessoas: ${numeroPessoas}\nValor por cliente: R$ ${valorPorCliente.toFixed(2)}`)
    </script>
</body>
</html>
