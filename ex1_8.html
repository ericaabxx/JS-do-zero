<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        const dias = Number(prompt("Número de dias"))
        const horas = Number(prompt("Número de horas"))
        const total = (24 * dias) + horas
        alert(`Total de horas da viagem: ${total} horas`)
    </script>
</body>
