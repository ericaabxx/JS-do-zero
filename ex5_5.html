<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Programa contas do mes</h1>
    <form>
        <p>Descricao da conta:
            <input type="text" id="inDescricao" required>
        </p>
        <p>Valor a pagar:
            <input type="number" id="inValor" min="0" step="0.1" required>
        </p>
        <input type="submit" value="registrar conta">
    </form>
    <pre id="outResp1"></pre>
    <pre id="outResp2"></pre>
</body>
<script>
    const form = document.querySelector("form")
    const resp1 = document.querySelector("#outResp1")
    const resp2 = document.querySelector("#outResp2")

    let resposta = ""

    let numContas = 0
    let valorTotal = 0

    form.addEventListener("submit", (e) => {
        e.preventDefault()

        const descricao = form.inDescricao.value
        const valor = Number(form.inValor.value)

        numContas++

        valorTotal = valorTotal + valor 
        resposta = resposta + descricao + " - R$: " + valor.toFixed(2) + "\n"
        
        resp1.innerText = `${resposta}`
        resp2.innerText = `${numContas}  Conta(s) - total R$: ${valorTotal.toFixed(2)}`
        
    })
</script>
</html>
