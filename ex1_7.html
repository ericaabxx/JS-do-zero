<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const valorJantar = Number(prompt("Insira o valor do jantar"))
        const porcentagemGarcom = valorJantar * 0.10
        const valorTotal = valorJantar + porcentagemGarcom
        alert(`Taxa garçom R$: ${porcentagemGarcom.toFixed(2)}\nTotal R$: ${valorTotal.toFixed(2)}`)
    </script>
</body>
</html>
